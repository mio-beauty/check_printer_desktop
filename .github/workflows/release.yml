name: release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package (electron-builder)
        run: npx electron-builder --win nsis --publish never

      - name: Add legacy installer filename (for backward-compatible downloads)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in release/ after packaging" }
          Copy-Item -Force $exe.FullName (Join-Path $exe.DirectoryName "CheckPrinterClient-Setup.exe")

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-test') || contains(github.ref_name, '-rc') }}
          name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
